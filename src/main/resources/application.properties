spring.application.name=BookEngine
server.port=${PORT:8080}
app.upload.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:10MB}
app.upload.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:11MB}
spring.servlet.multipart.max-file-size=${app.upload.max-file-size}
spring.servlet.multipart.max-request-size=${app.upload.max-request-size}
